# =============================================================
# IRRIGAZIONE - Dashboard Lovelace
# =============================================================
# Come installare:
#   1. HA → Impostazioni → Dashboard → Aggiungi dashboard
#   2. Scegli "Editor RAW" e incolla questo file
# OPPURE aggiungila a una dashboard esistente:
#   Modifica dashboard → Editor RAW → aggiungi sotto "views:"
#
# NOTA: sostituisci il prefisso delle entità se diverso.
# Il prefisso dipende dal nome che hai dato al sistema.
# Esempio: se hai chiamato il sistema "Irrigazione Giardino"
# le entità avranno prefisso diverso. Controlla in
# Impostazioni → Dispositivi → Sistema Irrigazione
# =============================================================

title: Irrigazione
views:

  # ════════════════════════════════════════════════════════
  # VISTA 1 — PANNELLO PRINCIPALE
  # ════════════════════════════════════════════════════════
  - title: Controllo
    path: irrigazione
    icon: mdi:sprinkler-variant
    cards:

      # ── Stato generale ──────────────────────────────────
      - type: entities
        title: "Stato sistema"
        show_header_toggle: false
        entities:
          - entity: switch.sistema_attivo
            name: "Sistema attivo"
          - entity: sensor.stato_irrigazione
            name: "Stato attuale"
          - entity: sensor.fattore_riduzione_irrigazione
            name: "Irrigazione attiva (%)"

      # ── Controllo manuale ───────────────────────────────
      - type: horizontal-stack
        cards:
          - type: button
            name: "Avvia ora"
            icon: mdi:play-circle-outline
            icon_height: 48px
            tap_action:
              action: call-service
              service: irrigazione.avvia_sequenza
          - type: button
            name: "Ferma tutto"
            icon: mdi:stop-circle-outline
            icon_height: 48px
            icon_color: red
            tap_action:
              action: call-service
              service: irrigazione.ferma_tutto

      # ── Zone in corso (4 card orizzontali) ──────────────
      - type: entities
        title: "Zone irrigazione"
        show_header_toggle: false
        entities:
          - type: section
            label: "Zona 1"
          - entity: text.nome_zona_1
            name: "Nome"
          - entity: number.zona_1_durata_base
            name: "Durata base"
          - entity: sensor.durata_effettiva_zona_1
            name: "Durata effettiva"

          - type: section
            label: "Zona 2"
          - entity: text.nome_zona_2
            name: "Nome"
          - entity: number.zona_2_durata_base
            name: "Durata base"
          - entity: sensor.durata_effettiva_zona_2
            name: "Durata effettiva"

          - type: section
            label: "Zona 3"
          - entity: text.nome_zona_3
            name: "Nome"
          - entity: number.zona_3_durata_base
            name: "Durata base"
          - entity: sensor.durata_effettiva_zona_3
            name: "Durata effettiva"

          - type: section
            label: "Zona 4"
          - entity: text.nome_zona_4
            name: "Nome"
          - entity: number.zona_4_durata_base
            name: "Durata base"
          - entity: sensor.durata_effettiva_zona_4
            name: "Durata effettiva"

          - type: section
            label: "Generale"
          - entity: number.attesa_tra_zone
            name: "Attesa tra zone"

  # ════════════════════════════════════════════════════════
  # VISTA 2 — PROGRAMMAZIONE
  # ════════════════════════════════════════════════════════
  - title: Programma
    path: irrigazione-programma
    icon: mdi:calendar-clock
    cards:

      # ── Giorni attivi ────────────────────────────────────
      - type: entities
        title: "Giorni attivi"
        show_header_toggle: false
        entities:
          - entity: switch.lunedi
            name: "Lunedì"
          - entity: switch.martedi
            name: "Martedì"
          - entity: switch.mercoledi
            name: "Mercoledì"
          - entity: switch.giovedi
            name: "Giovedì"
          - entity: switch.venerdi
            name: "Venerdì"
          - entity: switch.sabato
            name: "Sabato"
          - entity: switch.domenica
            name: "Domenica"

      # ── Fasce orarie ─────────────────────────────────────
      - type: entities
        title: "Fasce orarie (fino a 3 al giorno)"
        show_header_toggle: false
        entities:
          - type: section
            label: "Fascia 1"
          - entity: switch.fascia_1_attiva
            name: "Abilitata"
          - entity: time.orario_fascia_1
            name: "Orario"

          - type: section
            label: "Fascia 2"
          - entity: switch.fascia_2_attiva
            name: "Abilitata"
          - entity: time.orario_fascia_2
            name: "Orario"

          - type: section
            label: "Fascia 3"
          - entity: switch.fascia_3_attiva
            name: "Abilitata"
          - entity: time.orario_fascia_3
            name: "Orario"

  # ════════════════════════════════════════════════════════
  # VISTA 3 — METEO E ADATTAMENTO
  # ════════════════════════════════════════════════════════
  - title: Meteo
    path: irrigazione-meteo
    icon: mdi:weather-partly-rainy
    cards:

      # ── Gauge fattore riduzione ──────────────────────────
      - type: gauge
        entity: sensor.fattore_riduzione_irrigazione
        name: "Irrigazione attiva"
        min: 0
        max: 100
        needle: true
        severity:
          green: 70
          yellow: 30
          red: 0

      # ── Piogge recenti ───────────────────────────────────
      - type: entities
        title: "Piogge recenti (Open-Meteo)"
        show_header_toggle: false
        entities:
          - entity: sensor.pioggia_oggi
            name: "Oggi"
          - entity: sensor.pioggia_ieri
            name: "Ieri"
          - entity: sensor.2_giorni_fa
            name: "2 giorni fa"
          - entity: sensor.3_giorni_fa
            name: "3 giorni fa"
          - entity: sensor.4_giorni_fa
            name: "4 giorni fa"
          - entity: sensor.5_giorni_fa
            name: "5 giorni fa"
          - entity: sensor.6_giorni_fa
            name: "6 giorni fa"
          - type: section
            label: "Totale e previsioni"
          - entity: sensor.pioggia_storica_totale
            name: "Totale periodo analizzato"
          - entity: sensor.pioggia_prevista_domani
            name: "Prevista domani"
          - entity: sensor.probabilita_pioggia_domani
            name: "Probabilità pioggia domani"

      # ── Impostazioni soglie meteo ────────────────────────
      - type: entities
        title: "Regole adattamento meteo"
        show_header_toggle: false
        entities:
          - type: section
            label: "Analisi pioggia passata"
          - entity: number.giorni_da_analizzare
            name: "Giorni da analizzare"
          - entity: number.soglia_pioggia_storica
            name: "Soglia skip/riduzione (mm)"
          - entity: switch.salta_se_ha_piovuto_di_recente
            name: "Salta se supera soglia"
          - entity: switch.riduci_durata_se_ha_piovuto
            name: "Riduci proporzionalmente"

          - type: section
            label: "Previsione pioggia domani"
          - entity: number.soglia_pioggia_prevista
            name: "Soglia skip previsione (mm)"
          - entity: switch.salta_se_prevista_pioggia
            name: "Salta se supera soglia"
