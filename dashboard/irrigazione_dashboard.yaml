          # Toggle meteo — con feedback visivo acceso/spento
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.sistema_irrigazione_meteo_salta_se_pioggia_recente
                name: Skip storica
                icon: mdi:cancel
                icon_color: >
                  {{ 'red' if is_state('switch.sistema_irrigazione_meteo_salta_se_pioggia_recente','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(183,28,28,0.48)' if states('switch.sistema_irrigazione_meteo_salta_se_pioggia_recente') == 'on' else 'rgba(30,30,50,0.52)' }};
                      border: 2px solid {{ 'rgba(255,80,80,0.40)' if states('switch.sistema_irrigazione_meteo_salta_se_pioggia_recente') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 18px;
                    }

              - type: custom:mushroom-entity-card
                entity: switch.sistema_irrigazione_meteo_riduci_se_ha_piovuto
