# =============================================================
# 💧 IRRIGAZIONE — Dashboard Lovelace (pagina singola)
# =============================================================
# DIPENDENZE (installa da HACS → Frontend):
#   1. Mushroom Cards   →  cerca "Mushroom"
#   2. card-mod         →  cerca "card-mod"
#
# PREFISSO ENTITÀ:
#   Default assegnato durante il setup: "sistema_irrigazione_"
#   Se hai usato un nome diverso, fai Trova & Sostituisci:
#     "sistema_irrigazione_"  →  "il_tuo_prefisso_"
#
# COME IMPORTARE:
#   HA → Impostazioni → Dashboard → + → "Vuota"
#   Apri → ✏️ Modifica → Editor RAW → incolla → Salva
#
# NOTA COLLAPSIBLE:
#   Le sezioni non sono collassabili nativamente.
#   Per averle installare anche "Collapsable Cards" da HACS.
# =============================================================

title: 💧 Irrigazione
views:
  - title: Irrigazione
    path: irrigazione
    icon: mdi:sprinkler-variant
    cards:

      - type: vertical-stack
        cards:

          # ══════════════════════════════════════════════════════
          # 1. HEADER — Titolo + stato + master toggle
          # ══════════════════════════════════════════════════════
          - type: custom:mushroom-template-card
            entity: switch.sistema_irrigazione_controllo_sistema_attivo
            primary: 💧 Sistema Irrigazione
            secondary: >
              {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
              {% set f = states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) %}
              {% if not is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') %}🔴 Sistema disabilitato
              {% elif stato == 'Sospesa (pioggia)' %}🌧️ Irrigazione sospesa — troppa pioggia
              {% elif f < 100 and f > 0 %}⚡ {{ stato }} — irrigazione al {{ f }}%
              {% elif 'in corso' in stato %}💧 {{ stato }}
              {% else %}✅ {{ stato }}{% endif %}
            icon: >
              {% if is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') %}mdi:sprinkler-variant
              {% else %}mdi:sprinkler-variant{% endif %}
            icon_color: >
              {% if not is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') %}red
              {% elif states('sensor.sistema_irrigazione_controllo_stato') == 'Sospesa (pioggia)' %}orange
              {% elif 'in corso' in states('sensor.sistema_irrigazione_controllo_stato') %}cyan
              {% else %}green{% endif %}
            badge_icon: >
              {% if 'in corso' in states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water
              {% elif states('sensor.sistema_irrigazione_controllo_stato') == 'Sospesa (pioggia)' %}mdi:weather-rainy
              {% endif %}
            badge_color: >
              {% if 'in corso' in states('sensor.sistema_irrigazione_controllo_stato') %}blue
              {% else %}orange{% endif %}
            tap_action:
              action: toggle
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    rgba(13,71,161,0.88) 0%,
                    rgba(21,101,192,0.60) 55%,
                    rgba(3,169,244,0.28) 100%);
                  backdrop-filter: blur(14px);
                  -webkit-backdrop-filter: blur(14px);
                  border: 1px solid rgba(255,255,255,0.16);
                  border-radius: 26px;
                  padding: 4px 0;
                }

          # ══════════════════════════════════════════════════════
          # 2. CHIPS — Stato rapido
          # ══════════════════════════════════════════════════════
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: >
                  {{ 'mdi:power' if is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') else 'mdi:power-off' }}
                icon_color: >
                  {{ 'green' if is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') else 'red' }}
                content: >
                  {{ 'Attivo' if is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') else 'Spento' }}
                tap_action:
                  action: call-service
                  service: homeassistant.toggle
                  service_data:
                    entity_id: switch.sistema_irrigazione_controllo_sistema_attivo

              - type: template
                icon: mdi:percent
                icon_color: >
                  {% set v = states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) %}
                  {% if v >= 70 %}green{% elif v >= 30 %}orange{% else %}red{% endif %}
                content: "{{ states('sensor.sistema_irrigazione_meteo_fattore_riduzione') }}% irrigazione"

              - type: template
                icon: mdi:weather-rainy
                icon_color: >
                  {{ 'blue' if states('sensor.sistema_irrigazione_meteo_pioggia_oggi') | float(0) > 0 else 'grey' }}
                content: "{{ states('sensor.sistema_irrigazione_meteo_pioggia_oggi') }} mm oggi"

              - type: template
                icon: mdi:calendar-check
                icon_color: >
                  {% set n = namespace(c=0) %}
                  {% for e in ['switch.sistema_irrigazione_giorni_lunedi',
                               'switch.sistema_irrigazione_giorni_martedi',
                               'switch.sistema_irrigazione_giorni_mercoledi',
                               'switch.sistema_irrigazione_giorni_giovedi',
                               'switch.sistema_irrigazione_giorni_venerdi',
                               'switch.sistema_irrigazione_giorni_sabato',
                               'switch.sistema_irrigazione_giorni_domenica'] %}
                    {% if is_state(e,'on') %}{% set n.c = n.c + 1 %}{% endif %}
                  {% endfor %}
                  {{ 'green' if n.c > 0 else 'grey' }}
                content: >
                  {% set n = namespace(c=0) %}
                  {% for e in ['switch.sistema_irrigazione_giorni_lunedi',
                               'switch.sistema_irrigazione_giorni_martedi',
                               'switch.sistema_irrigazione_giorni_mercoledi',
                               'switch.sistema_irrigazione_giorni_giovedi',
                               'switch.sistema_irrigazione_giorni_venerdi',
                               'switch.sistema_irrigazione_giorni_sabato',
                               'switch.sistema_irrigazione_giorni_domenica'] %}
                    {% if is_state(e,'on') %}{% set n.c = n.c + 1 %}{% endif %}
                  {% endfor %}
                  {{ n.c }}/7 giorni

          # ══════════════════════════════════════════════════════
          # 3. AVVIA / FERMA
          # ══════════════════════════════════════════════════════
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Avvia tutto
                secondary: Sequenza completa
                icon: mdi:play-circle
                icon_color: green
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_sequenza
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg,
                        rgba(27,94,32,0.88) 0%,
                        rgba(56,142,60,0.60) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(100,255,100,0.22);
                      border-radius: 22px;
                      cursor: pointer;
                    }

              - type: custom:mushroom-template-card
                primary: Ferma tutto
                secondary: Stop immediato
                icon: mdi:stop-circle
                icon_color: red
                tap_action:
                  action: call-service
                  service: irrigazione.ferma_tutto
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg,
                        rgba(183,28,28,0.88) 0%,
                        rgba(229,57,53,0.60) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,100,100,0.22);
                      border-radius: 22px;
                      cursor: pointer;
                    }

          # ══════════════════════════════════════════════════════
          # 4. ZONE — 2 × 2
          #    Tap  = avvia quella zona
          #    Hold = modifica durata (more-info)
          # ══════════════════════════════════════════════════════
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: >
                  {{ states('text.sistema_irrigazione_zona_1_nome') or 'Zona 1' }}
                secondary: >
                  {% set eff  = states('sensor.sistema_irrigazione_zona_1_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_1_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome  = states('text.sistema_irrigazione_zona_1_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 Irrigando ora
                  {% elif eff == 0 %}⏸ Sospesa — pioggia
                  {% elif eff < base %}⚡ {{ eff }} min · ridotta
                  {% else %}⏱ {{ eff }} min  ·  tieni per modificare{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set nome = states('text.sistema_irrigazione_zona_1_nome') %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% if nome ~ ' in corso' == stato %}cyan
                  {% elif states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) == 0 %}red
                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_1_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: cyan
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 1
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_1_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.88) 0%,
                        rgba(0,151,167,0.48) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(0,229,255,0.18);
                      border-radius: 22px;
                      min-height: 95px;
                    }

              - type: custom:mushroom-template-card
                primary: >
                  {{ states('text.sistema_irrigazione_zona_2_nome') or 'Zona 2' }}
                secondary: >
                  {% set eff  = states('sensor.sistema_irrigazione_zona_2_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_2_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome  = states('text.sistema_irrigazione_zona_2_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 Irrigando ora
                  {% elif eff == 0 %}⏸ Sospesa — pioggia
                  {% elif eff < base %}⚡ {{ eff }} min · ridotta
                  {% else %}⏱ {{ eff }} min  ·  tieni per modificare{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set nome = states('text.sistema_irrigazione_zona_2_nome') %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% if nome ~ ' in corso' == stato %}cyan
                  {% elif states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) == 0 %}red
                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_2_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: cyan
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 2
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_2_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.88) 0%,
                        rgba(0,151,167,0.48) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(0,229,255,0.18);
                      border-radius: 22px;
                      min-height: 95px;
                    }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: >
                  {{ states('text.sistema_irrigazione_zona_3_nome') or 'Zona 3' }}
                secondary: >
                  {% set eff  = states('sensor.sistema_irrigazione_zona_3_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_3_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome  = states('text.sistema_irrigazione_zona_3_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 Irrigando ora
                  {% elif eff == 0 %}⏸ Sospesa — pioggia
                  {% elif eff < base %}⚡ {{ eff }} min · ridotta
                  {% else %}⏱ {{ eff }} min  ·  tieni per modificare{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set nome = states('text.sistema_irrigazione_zona_3_nome') %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% if nome ~ ' in corso' == stato %}cyan
                  {% elif states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) == 0 %}red
                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_3_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: cyan
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 3
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_3_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.88) 0%,
                        rgba(0,151,167,0.48) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(0,229,255,0.18);
                      border-radius: 22px;
                      min-height: 95px;
                    }

              - type: custom:mushroom-template-card
                primary: >
                  {{ states('text.sistema_irrigazione_zona_4_nome') or 'Zona 4' }}
                secondary: >
                  {% set eff  = states('sensor.sistema_irrigazione_zona_4_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_4_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome  = states('text.sistema_irrigazione_zona_4_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 Irrigando ora
                  {% elif eff == 0 %}⏸ Sospesa — pioggia
                  {% elif eff < base %}⚡ {{ eff }} min · ridotta
                  {% else %}⏱ {{ eff }} min  ·  tieni per modificare{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set nome = states('text.sistema_irrigazione_zona_4_nome') %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% if nome ~ ' in corso' == stato %}cyan
                  {% elif states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) == 0 %}red
                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_4_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: cyan
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 4
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_4_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.88) 0%,
                        rgba(0,151,167,0.48) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(0,229,255,0.18);
                      border-radius: 22px;
                      min-height: 95px;
                    }

          # ══════════════════════════════════════════════════════
          # 5. PROGRAMMA — Giorni
          #    FIX: entity esplicita → toggle funziona
          #    icona check/circle-outline per stato chiaro
          # ══════════════════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "⏰ Programma"
            subtitle: Tocca un giorno per abilitarlo/disabilitarlo

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_lunedi
                primary: LUN
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_lunedi','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_lunedi','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(13,71,161,0.80)' if states('switch.sistema_irrigazione_giorni_lunedi') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(100,149,237,0.55)' if states('switch.sistema_irrigazione_giorni_lunedi') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_martedi
                primary: MAR
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_martedi','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_martedi','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(13,71,161,0.80)' if states('switch.sistema_irrigazione_giorni_martedi') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(100,149,237,0.55)' if states('switch.sistema_irrigazione_giorni_martedi') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_mercoledi
                primary: MER
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_mercoledi','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_mercoledi','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(13,71,161,0.80)' if states('switch.sistema_irrigazione_giorni_mercoledi') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(100,149,237,0.55)' if states('switch.sistema_irrigazione_giorni_mercoledi') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_giovedi
                primary: GIO
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_giovedi','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_giovedi','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(13,71,161,0.80)' if states('switch.sistema_irrigazione_giorni_giovedi') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(100,149,237,0.55)' if states('switch.sistema_irrigazione_giorni_giovedi') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_venerdi
                primary: VEN
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_venerdi','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_venerdi','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(13,71,161,0.80)' if states('switch.sistema_irrigazione_giorni_venerdi') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(100,149,237,0.55)' if states('switch.sistema_irrigazione_giorni_venerdi') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_sabato
                primary: SAB
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_sabato','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'orange' if is_state('switch.sistema_irrigazione_giorni_sabato','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(230,81,0,0.75)' if states('switch.sistema_irrigazione_giorni_sabato') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(255,150,50,0.55)' if states('switch.sistema_irrigazione_giorni_sabato') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                entity: switch.sistema_irrigazione_giorni_domenica
                primary: DOM
                icon: >
                  {{ 'mdi:check-circle' if is_state('switch.sistema_irrigazione_giorni_domenica','on') else 'mdi:circle-outline' }}
                icon_color: >
                  {{ 'orange' if is_state('switch.sistema_irrigazione_giorni_domenica','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(230,81,0,0.75)' if states('switch.sistema_irrigazione_giorni_domenica') == 'on' else 'rgba(38,38,58,0.55)' }};
                      border: 2px solid {{ 'rgba(255,150,50,0.55)' if states('switch.sistema_irrigazione_giorni_domenica') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 16px;
                    }

          # ══════════════════════════════════════════════════════
          # 6. FASCE ORARIE
          #    Tap       = abilita/disabilita fascia
          #    Tieni     = modifica orario (more-info)
          #    Verde quando attiva, grigio quando disabilitata
          # ══════════════════════════════════════════════════════
          - type: custom:mushroom-template-card
            entity: switch.sistema_irrigazione_fascia_1_attiva
            primary: >
              Fascia 1  ·  {{ states('time.sistema_irrigazione_fascia_1_orario') }}
            secondary: >
              {{ '✅ Attiva — tocca per disabilitare · tieni per cambiare orario' if is_state('switch.sistema_irrigazione_fascia_1_attiva','on') else '⛔ Disabilitata — tocca per attivare' }}
            icon: mdi:clock-time-seven-outline
            icon_color: >
              {{ 'green' if is_state('switch.sistema_irrigazione_fascia_1_attiva','on') else 'grey' }}
            tap_action:
              action: toggle
            hold_action:
              action: more-info
              entity: time.sistema_irrigazione_fascia_1_orario
            card_mod:
              style: |
                ha-card {
                  background: {{ 'linear-gradient(135deg, rgba(27,94,32,0.75) 0%, rgba(56,142,60,0.40) 100%)' if states('switch.sistema_irrigazione_fascia_1_attiva') == 'on' else 'rgba(38,38,58,0.55)' }};
                  backdrop-filter: blur(8px);
                  border: 2px solid {{ 'rgba(76,175,80,0.60)' if states('switch.sistema_irrigazione_fascia_1_attiva') == 'on' else 'rgba(255,255,255,0.07)' }};
                  border-radius: 18px;
                }

          - type: custom:mushroom-template-card
            entity: switch.sistema_irrigazione_fascia_2_attiva
            primary: >
              Fascia 2  ·  {{ states('time.sistema_irrigazione_fascia_2_orario') }}
            secondary: >
              {{ '✅ Attiva — tocca per disabilitare · tieni per cambiare orario' if is_state('switch.sistema_irrigazione_fascia_2_attiva','on') else '⛔ Disabilitata — tocca per attivare' }}
            icon: mdi:clock-time-three-outline
