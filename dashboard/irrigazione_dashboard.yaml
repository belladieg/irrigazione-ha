# =============================================================
# IRRIGAZIONE — Dashboard Lovelace
# =============================================================
# Come importare:
#   1. Copia il contenuto di questo file
#   2. HA → Impostazioni → Dashboard → + → "Vuota"
#   3. Apri la dashboard → matita → Editor RAW → incolla
#
# I nomi entità seguono il prefisso del tuo sistema.
# Se hai chiamato il sistema "Irrigazione Giardino" i prefissi
# potrebbero essere diversi. Controlla in:
# Impostazioni → Dispositivi → Sistema Irrigazione → copia entity_id
# =============================================================

title: Irrigazione
views:

  # ════════════════════════════════════════════════════════
  # VISTA 1 — CONTROLLO
  # ════════════════════════════════════════════════════════
  - title: Controllo
    path: irrigazione
    icon: mdi:sprinkler-variant
    cards:

      # ── Stato e master switch ────────────────────────────
      - type: entities
        title: "Sistema"
        show_header_toggle: false
        entities:
          - entity: switch.controllo_sistema_attivo
            name: "Sistema attivo"
          - entity: sensor.controllo_stato
            name: "Stato attuale"
          - entity: sensor.meteo_fattore_riduzione
            name: "Irrigazione attiva (%)"

      # ── Pulsanti avvio / stop ───────────────────────────
      - type: horizontal-stack
        cards:
          - type: button
            name: "Avvia ora"
            icon: mdi:play-circle-outline
            icon_height: 52px
            tap_action:
              action: call-service
              service: irrigazione.avvia_sequenza
          - type: button
            name: "Ferma tutto"
            icon: mdi:stop-circle-outline
            icon_height: 52px
            icon_color: red
            tap_action:
              action: call-service
              service: irrigazione.ferma_tutto

      # ── Zone ────────────────────────────────────────────
      - type: entities
        title: "Zone"
        show_header_toggle: false
        entities:
          - type: section
            label: "Zona 1"
          - entity: text.zona_1_nome
            name: "Nome"
          - entity: number.zona_1_durata_base
            name: "Durata base"
          - entity: sensor.zona_1_durata_effettiva
            name: "Durata effettiva"

          - type: section
            label: "Zona 2"
          - entity: text.zona_2_nome
            name: "Nome"
          - entity: number.zona_2_durata_base
            name: "Durata base"
          - entity: sensor.zona_2_durata_effettiva
            name: "Durata effettiva"

          - type: section
            label: "Zona 3"
          - entity: text.zona_3_nome
            name: "Nome"
          - entity: number.zona_3_durata_base
            name: "Durata base"
          - entity: sensor.zona_3_durata_effettiva
            name: "Durata effettiva"

          - type: section
            label: "Zona 4"
          - entity: text.zona_4_nome
            name: "Nome"
          - entity: number.zona_4_durata_base
            name: "Durata base"
          - entity: sensor.zona_4_durata_effettiva
            name: "Durata effettiva"

          - type: section
            label: "Generale"
          - entity: number.zone_attesa_tra_zone
            name: "Attesa tra zone"

  # ════════════════════════════════════════════════════════
  # VISTA 2 — PROGRAMMAZIONE
  # ════════════════════════════════════════════════════════
  - title: Programma
    path: irrigazione-programma
    icon: mdi:calendar-clock
    cards:

      # ── Giorni attivi ────────────────────────────────────
      - type: entities
        title: "Giorni attivi"
        show_header_toggle: false
        entities:
          - entity: switch.giorni_lunedi
            name: "Lunedì"
          - entity: switch.giorni_martedi
            name: "Martedì"
          - entity: switch.giorni_mercoledi
            name: "Mercoledì"
          - entity: switch.giorni_giovedi
            name: "Giovedì"
          - entity: switch.giorni_venerdi
            name: "Venerdì"
          - entity: switch.giorni_sabato
            name: "Sabato"
          - entity: switch.giorni_domenica
            name: "Domenica"

      # ── Fasce orarie ─────────────────────────────────────
      - type: entities
        title: "Fasce orarie (fino a 3 al giorno)"
        show_header_toggle: false
        entities:
          - type: section
            label: "Fascia 1"
          - entity: switch.fascia_1_attiva
            name: "Abilitata"
          - entity: time.fascia_1_orario
            name: "Orario"

          - type: section
            label: "Fascia 2"
          - entity: switch.fascia_2_attiva
            name: "Abilitata"
          - entity: time.fascia_2_orario
            name: "Orario"

          - type: section
            label: "Fascia 3"
          - entity: switch.fascia_3_attiva
            name: "Abilitata"
          - entity: time.fascia_3_orario
            name: "Orario"

  # ════════════════════════════════════════════════════════
  # VISTA 3 — METEO
  # ════════════════════════════════════════════════════════
  - title: Meteo
    path: irrigazione-meteo
    icon: mdi:weather-partly-rainy
    cards:

      # ── Gauge fattore riduzione ──────────────────────────
      - type: gauge
        entity: sensor.meteo_fattore_riduzione
        name: "Irrigazione attiva"
        min: 0
        max: 100
        needle: true
        severity:
          green: 70
          yellow: 30
          red: 0

      # ── Piogge recenti ───────────────────────────────────
      - type: entities
        title: "Piogge recenti (Open-Meteo)"
        show_header_toggle: false
        entities:
          - entity: sensor.meteo_pioggia_oggi
            name: "Oggi"
          - entity: sensor.meteo_pioggia_ieri
            name: "Ieri"
          - entity: sensor.meteo_pioggia_2_giorni_fa
            name: "2 giorni fa"
          - entity: sensor.meteo_pioggia_3_giorni_fa
            name: "3 giorni fa"
          - entity: sensor.meteo_pioggia_4_giorni_fa
            name: "4 giorni fa"
          - entity: sensor.meteo_pioggia_5_giorni_fa
            name: "5 giorni fa"
          - entity: sensor.meteo_pioggia_6_giorni_fa
            name: "6 giorni fa"
          - type: section
            label: "Totale e previsioni"
          - entity: sensor.meteo_pioggia_storica_totale
            name: "Totale periodo analizzato"
          - entity: sensor.meteo_pioggia_prevista_domani
            name: "Prevista domani"
          - entity: sensor.meteo_probabilita_pioggia_domani
            name: "Probabilità pioggia domani"

      # ── Soglie e regole meteo ────────────────────────────
      - type: entities
        title: "Regole adattamento meteo"
        show_header_toggle: false
        entities:
          - type: section
            label: "Analisi pioggia passata"
          - entity: number.meteo_giorni_da_analizzare
            name: "Giorni da analizzare"
          - entity: number.meteo_soglia_pioggia_storica
            name: "Soglia skip/riduzione (mm)"
          - entity: switch.meteo_salta_se_pioggia_recente
            name: "Salta se supera soglia"
          - entity: switch.meteo_riduci_se_ha_piovuto
            name: "Riduci proporzionalmente"

          - type: section
            label: "Previsione pioggia domani"
          - entity: number.meteo_soglia_pioggia_prevista
            name: "Soglia skip previsione (mm)"
          - entity: switch.meteo_salta_se_pioggia_prevista
            name: "Salta se supera soglia"
