                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_3_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: blue
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 3
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_3_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.8) 0%,
                        rgba(0,151,167,0.4) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 22px;
                      min-height: 90px;
                    }

              # ── Zona 4 ─────────────────────────────────
              - type: custom:mushroom-template-card
                primary: "{{ states('text.sistema_irrigazione_zona_4_nome') }}"
                secondary: >
                  {% set eff = states('sensor.sistema_irrigazione_zona_4_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_4_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome = states('text.sistema_irrigazione_zona_4_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 In irrigazione
                  {% elif eff == 0 %}⏸ Sospesa
                  {% elif eff < base %}⚡ {{ eff }} min (ridotta)
                  {% else %}⏱ {{ eff }} min{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome = states('text.sistema_irrigazione_zona_4_nome') %}
                  {% if nome ~ ' in corso' == stato %}light-blue
                  {% elif states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) == 0 %}red
                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_4_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: blue
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 4
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_4_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.8) 0%,
                        rgba(0,151,167,0.4) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 22px;
                      min-height: 90px;
                    }

          # ══════════════════════════════════════════════════
          # 5. PROGRAMMA — Giorni + Fasce
          # ══════════════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "⏰ Programma"
            subtitle: Giorni attivi e orari di avvio

          # Giorni: 7 chip colorati
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Lun
                icon: mdi:circle
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_lunedi','on') else 'disabled' }}
                tap_action:
                  action: toggle
                  entity: switch.sistema_irrigazione_giorni_lunedi
                card_mod:
                  style: |
                    ha-card {
                      background: {{ 'rgba(13,71,161,0.7)' if states('switch.sistema_irrigazione_giorni_lunedi') == 'on' else 'rgba(50,50,50,0.4)' }};
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 16px;
                      padding: 0;
                    }
                    mushroom-shape-icon { --icon-size: 28px; }

              - type: custom:mushroom-template-card
                primary: Mar
                icon: mdi:circle
                icon_color: >
                  {{ 'blue' if is_state('switch.sistema_irrigazione_giorni_martedi','on') else 'disabled' }}
                tap_action:
                  action: toggle
                  entity: switch.sistema_irrigazione_giorni_martedi
