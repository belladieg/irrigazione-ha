                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 16px;
                    }
                    mushroom-shape-icon { --icon-size: 28px; }

          # Fasce: switch + time picker affiancati
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.sistema_irrigazione_fascia_1_attiva
                name: Fascia 1
                icon: mdi:clock-time-seven-outline
                icon_color: >
                  {{ 'green' if is_state('switch.sistema_irrigazione_fascia_1_attiva','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(30,30,50,0.6);
                      backdrop-filter: blur(8px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-entity-card
                entity: time.sistema_irrigazione_fascia_1_orario
