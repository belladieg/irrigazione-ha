          # ══════════════════════════════════════════════════════
          # 7. METEO
          # ══════════════════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "🌧️ Meteo"
            subtitle: Adattamento automatico via Open-Meteo

          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.sistema_irrigazione_meteo_fattore_riduzione
                name: Irrigazione %
                min: 0
                max: 100
                needle: true
                severity:
                  green: 70
                  yellow: 30
                  red: 0
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg,
                        rgba(13,71,161,0.58) 0%,
                        rgba(3,169,244,0.22) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.11);
                      border-radius: 22px;
                    }

              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.sistema_irrigazione_meteo_pioggia_oggi') }} mm"
                    secondary: Oggi
                    icon: mdi:weather-rainy
                    icon_color: >
                      {{ 'blue' if states('sensor.sistema_irrigazione_meteo_pioggia_oggi') | float(0) > 0 else 'grey' }}
                    multiline_secondary: false
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(13,71,161,0.42);
                          backdrop-filter: blur(8px);
                          border: 1px solid rgba(255,255,255,0.10);
                          border-radius: 18px;
                          margin-bottom: 4px;
                        }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.sistema_irrigazione_meteo_pioggia_prevista_domani') }} mm"
                    secondary: >
                      Domani · {{ states('sensor.sistema_irrigazione_meteo_probabilita_pioggia_domani') }}% prob.
                    icon: mdi:weather-partly-rainy
                    icon_color: >
                      {% set mm = states('sensor.sistema_irrigazione_meteo_pioggia_prevista_domani') | float(0) %}
                      {% set soglia = states('number.sistema_irrigazione_meteo_soglia_pioggia_prevista') | float(3) %}
                      {{ 'red' if mm >= soglia else 'cyan' }}
                    multiline_secondary: false
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(13,71,161,0.42);
                          backdrop-filter: blur(8px);
                          border: 1px solid rgba(255,255,255,0.10);
                          border-radius: 18px;
                        }

          # Grafico barre testo ultimi 7 giorni
          - type: custom:mushroom-template-card
            primary: >
              Ultimi {{ states('number.sistema_irrigazione_meteo_giorni_da_analizzare') | int }} giorni — {{ states('sensor.sistema_irrigazione_meteo_pioggia_storica_totale') }} mm totali
            secondary: >
              {% set s = [
                states('sensor.sistema_irrigazione_meteo_pioggia_6_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_5_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_4_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_3_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_2_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_ieri') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_oggi') | float(0)
              ] %}
              {% set max_v = [s | max, 0.1] | max %}
              {% set giorni = ['-6','-5','-4','-3','-2','-1','oggi'] %}
              {% for v in s %}{% set b = (v / max_v * 6) | round(0) | int %}{{ giorni[loop.index0] }}: {{ '█' * b }}{{ '░' * (6 - b) }} {{ v }}mm
              {% endfor %}
            icon: mdi:chart-bar
            icon_color: blue
            multiline_secondary: true
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    rgba(13,71,161,0.52) 0%,
                    rgba(21,101,192,0.28) 100%);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255,255,255,0.10);
                  border-radius: 22px;
                }
                mushroom-state-info { font-family: monospace; font-size: 0.85em; }

          # Grafico HA ultimi 7 giorni
          - type: history-graph
            title: Andamento pioggia e irrigazione (7 giorni)
            hours_to_show: 168
            entities:
              - entity: sensor.sistema_irrigazione_meteo_pioggia_storica_totale
                name: Pioggia cumulata (mm)
              - entity: sensor.sistema_irrigazione_meteo_fattore_riduzione
                name: Fattore irrigazione (%)
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    rgba(13,71,161,0.42) 0%,
                    rgba(21,101,192,0.20) 100%);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255,255,255,0.10);
                  border-radius: 22px;
                }

