# =============================================================
# 💧 IRRIGAZIONE — Dashboard Lovelace (pagina singola)
# =============================================================
# DIPENDENZE (installa da HACS → Frontend):
#   1. Mushroom Cards  →  cerca "Mushroom"
#   2. card-mod        →  cerca "card-mod"
#
# PREFISSO ENTITÀ:
#   Le entità usano il prefisso del nome scelto al setup.
#   Default: "sistema_irrigazione_"
#   Se hai scelto un altro nome, fai Trova & Sostituisci:
#     "sistema_irrigazione_"  →  "il_tuo_prefisso_"
#
# COME IMPORTARE:
#   HA → Impostazioni → Dashboard → + → "Vuota"
#   Apri → ✏️ Modifica → Editor RAW → incolla → Salva
# =============================================================

title: 💧 Irrigazione
views:
  - title: Irrigazione
    path: irrigazione
    icon: mdi:sprinkler-variant
    cards:

      # Tutto in un unico stack verticale = una sola pagina
      - type: vertical-stack
        cards:

          # ══════════════════════════════════════════════════
          # 1. HEADER — Titolo + stato sistema
          # ══════════════════════════════════════════════════
          - type: custom:mushroom-template-card
            primary: 💧 Sistema Irrigazione
            secondary: >
              {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
              {% set f = states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) %}
              {% if stato == 'Disabilitata' %}🔴 Sistema disabilitato
              {% elif stato == 'Sospesa (pioggia)' %}🌧️ Sospesa — troppa pioggia
              {% elif f < 100 and f > 0 %}⚡ {{ stato }} — ridotta al {{ f }}%
              {% else %}{{ stato }}{% endif %}
            icon: mdi:sprinkler-variant
            icon_color: >
              {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
              {% if stato == 'Disabilitata' %}red
              {% elif stato == 'Sospesa (pioggia)' %}orange
              {% elif 'in corso' in stato %}light-blue
              {% else %}green{% endif %}
            badge_icon: >
              {% if 'in corso' in states('sensor.sistema_irrigazione_controllo_stato') %}
                mdi:water
              {% elif states('sensor.sistema_irrigazione_controllo_stato') == 'Sospesa (pioggia)' %}
                mdi:weather-rainy
              {% endif %}
            badge_color: >
              {% if 'in corso' in states('sensor.sistema_irrigazione_controllo_stato') %}
                blue
              {% else %}orange{% endif %}
            multiline_secondary: false
            tap_action:
              action: more-info
              entity: switch.sistema_irrigazione_controllo_sistema_attivo
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    rgba(13,71,161,0.85) 0%,
                    rgba(21,101,192,0.55) 60%,
                    rgba(3,169,244,0.25) 100%);
                  backdrop-filter: blur(12px);
                  -webkit-backdrop-filter: blur(12px);
                  border: 1px solid rgba(255,255,255,0.13);
                  border-radius: 24px;
                  padding: 4px 0;
                }

          # ══════════════════════════════════════════════════
          # 2. CHIPS — Stato rapido
          # ══════════════════════════════════════════════════
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:power
                icon_color: >
                  {{ 'green' if is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') else 'red' }}
                content: >
                  {{ 'Attivo' if is_state('switch.sistema_irrigazione_controllo_sistema_attivo','on') else 'Spento' }}
                tap_action:
                  action: toggle
                  entity: switch.sistema_irrigazione_controllo_sistema_attivo

              - type: template
                icon: mdi:percent
                icon_color: >
                  {% set v = states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) %}
                  {% if v >= 70 %}green{% elif v >= 30 %}orange{% else %}red{% endif %}
                content: "{{ states('sensor.sistema_irrigazione_meteo_fattore_riduzione') }}%"

              - type: template
                icon: mdi:weather-rainy
                icon_color: blue
                content: "{{ states('sensor.sistema_irrigazione_meteo_pioggia_oggi') }} mm"

              - type: template
                icon: mdi:calendar-clock
                icon_color: >
                  {% set giorni = namespace(attivi=0) %}
                  {% for e in ['switch.sistema_irrigazione_giorni_lunedi',
                               'switch.sistema_irrigazione_giorni_martedi',
                               'switch.sistema_irrigazione_giorni_mercoledi',
                               'switch.sistema_irrigazione_giorni_giovedi',
                               'switch.sistema_irrigazione_giorni_venerdi',
                               'switch.sistema_irrigazione_giorni_sabato',
                               'switch.sistema_irrigazione_giorni_domenica'] %}
                    {% if is_state(e,'on') %}{% set giorni.attivi = giorni.attivi + 1 %}{% endif %}
                  {% endfor %}
                  {{ 'green' if giorni.attivi > 0 else 'grey' }}
                content: >
                  {% set giorni = namespace(attivi=0) %}
                  {% for e in ['switch.sistema_irrigazione_giorni_lunedi',
                               'switch.sistema_irrigazione_giorni_martedi',
                               'switch.sistema_irrigazione_giorni_mercoledi',
                               'switch.sistema_irrigazione_giorni_giovedi',
                               'switch.sistema_irrigazione_giorni_venerdi',
                               'switch.sistema_irrigazione_giorni_sabato',
                               'switch.sistema_irrigazione_giorni_domenica'] %}
                    {% if is_state(e,'on') %}{% set giorni.attivi = giorni.attivi + 1 %}{% endif %}
                  {% endfor %}
                  {{ giorni.attivi }}/7 giorni

          # ══════════════════════════════════════════════════
          # 3. AVVIA / FERMA
          # ══════════════════════════════════════════════════
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Avvia ora
                secondary: Tutte le zone
                icon: mdi:play-circle-outline
                icon_color: green
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_sequenza
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg,
                        rgba(27,94,32,0.85) 0%,
                        rgba(56,142,60,0.55) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(100,255,100,0.15);
                      border-radius: 22px;
                      cursor: pointer;
                    }
              - type: custom:mushroom-template-card
                primary: Ferma tutto
                secondary: Stop immediato
                icon: mdi:stop-circle-outline
                icon_color: red
                tap_action:
                  action: call-service
                  service: irrigazione.ferma_tutto
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg,
                        rgba(183,28,28,0.85) 0%,
                        rgba(229,57,53,0.55) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,100,100,0.15);
                      border-radius: 22px;
                      cursor: pointer;
                    }

          # ══════════════════════════════════════════════════
          # 4. ZONE — 2 × 2 grid
          # ══════════════════════════════════════════════════
          - type: horizontal-stack
            cards:
              # ── Zona 1 ─────────────────────────────────
              - type: custom:mushroom-template-card
                primary: "{{ states('text.sistema_irrigazione_zona_1_nome') }}"
                secondary: >
                  {% set eff = states('sensor.sistema_irrigazione_zona_1_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_1_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome = states('text.sistema_irrigazione_zona_1_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 In irrigazione
                  {% elif eff == 0 %}⏸ Sospesa
                  {% elif eff < base %}⚡ {{ eff }} min (ridotta)
                  {% else %}⏱ {{ eff }} min{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome = states('text.sistema_irrigazione_zona_1_nome') %}
                  {% if nome ~ ' in corso' == stato %}light-blue
                  {% elif states('sensor.sistema_irrigazione_meteo_fattore_riduzione') | int(100) == 0 %}red
                  {% else %}teal{% endif %}
                badge_icon: >
                  {% if states('text.sistema_irrigazione_zona_1_nome') ~ ' in corso'
                     == states('sensor.sistema_irrigazione_controllo_stato') %}mdi:water{% endif %}
                badge_color: blue
                tap_action:
                  action: call-service
                  service: irrigazione.avvia_zona
                  service_data:
                    zona: 1
                hold_action:
                  action: more-info
                  entity: number.sistema_irrigazione_zona_1_durata_base
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(160deg,
                        rgba(0,96,100,0.8) 0%,
                        rgba(0,151,167,0.4) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 22px;
                      min-height: 90px;
                    }

              # ── Zona 2 ─────────────────────────────────
              - type: custom:mushroom-template-card
                primary: "{{ states('text.sistema_irrigazione_zona_2_nome') }}"
                secondary: >
                  {% set eff = states('sensor.sistema_irrigazione_zona_2_durata_effettiva') | int(0) %}
                  {% set base = states('number.sistema_irrigazione_zona_2_durata_base') | int(10) %}
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome = states('text.sistema_irrigazione_zona_2_nome') %}
                  {% if nome ~ ' in corso' == stato %}💧 In irrigazione
                  {% elif eff == 0 %}⏸ Sospesa
                  {% elif eff < base %}⚡ {{ eff }} min (ridotta)
                  {% else %}⏱ {{ eff }} min{% endif %}
                icon: mdi:sprinkler
                icon_color: >
                  {% set stato = states('sensor.sistema_irrigazione_controllo_stato') %}
                  {% set nome = states('text.sistema_irrigazione_zona_2_nome') %}
                  {% if nome ~ ' in corso' == stato %}light-blue
