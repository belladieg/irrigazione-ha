              - type: custom:mushroom-entity-card
                entity: time.sistema_irrigazione_fascia_3_orario
                name: Orario
                icon: mdi:clock-edit-outline
                icon_color: blue
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(30,30,50,0.6);
                      backdrop-filter: blur(8px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }

          # ══════════════════════════════════════════════════
          # 6. METEO — Dati pioggia e adattamento
          # ══════════════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "🌧️ Meteo"
            subtitle: Adattamento automatico da Open-Meteo

          # Gauge fattore riduzione + stats oggi/domani
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.sistema_irrigazione_meteo_fattore_riduzione
                name: Irrigazione
                min: 0
                max: 100
                needle: true
                severity:
                  green: 70
                  yellow: 30
                  red: 0
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg,
                        rgba(13,71,161,0.5) 0%,
                        rgba(3,169,244,0.2) 100%);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 22px;
                    }

              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.sistema_irrigazione_meteo_pioggia_oggi') }} mm"
                    secondary: Pioggia oggi
                    icon: mdi:weather-rainy
                    icon_color: >
                      {% set mm = states('sensor.sistema_irrigazione_meteo_pioggia_oggi') | float(0) %}
                      {{ 'blue' if mm > 0 else 'grey' }}
                    multiline_secondary: false
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(13,71,161,0.35);
                          backdrop-filter: blur(8px);
                          border: 1px solid rgba(255,255,255,0.1);
                          border-radius: 18px;
                          margin-bottom: 4px;
                        }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.sistema_irrigazione_meteo_pioggia_prevista_domani') }} mm"
                    secondary: >
                      Domani — {{ states('sensor.sistema_irrigazione_meteo_probabilita_pioggia_domani') }}% prob.
                    icon: mdi:weather-partly-rainy
                    icon_color: >
                      {% set mm = states('sensor.sistema_irrigazione_meteo_pioggia_prevista_domani') | float(0) %}
                      {% set soglia = states('number.sistema_irrigazione_meteo_soglia_pioggia_prevista') | float(3) %}
                      {{ 'red' if mm >= soglia else 'blue' }}
                    multiline_secondary: false
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(13,71,161,0.35);
                          backdrop-filter: blur(8px);
                          border: 1px solid rgba(255,255,255,0.1);
                          border-radius: 18px;
                        }

          # Pioggia storica 7 giorni
          - type: custom:mushroom-template-card
            primary: >
              Pioggia storica: {{ states('sensor.sistema_irrigazione_meteo_pioggia_storica_totale') }} mm
              (ultimi {{ states('number.sistema_irrigazione_meteo_giorni_da_analizzare') | int }} gg)
            secondary: >
              {% set s = [
                states('sensor.sistema_irrigazione_meteo_pioggia_6_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_5_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_4_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_3_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_2_giorni_fa') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_ieri') | float(0),
                states('sensor.sistema_irrigazione_meteo_pioggia_oggi') | float(0)
              ] %}
              {% set max_val = s | max | float(1) %}
              {% set giorni = ['-6','-5','-4','-3','-2','-1','oggi'] %}
              {% for v in s %}
                {% set bar = (v / max_val * 5) | round(0) | int if max_val > 0 else 0 %}
                {{ giorni[loop.index0] }}: {{ '█' * bar }}{{ '░' * (5 - bar) }} {{ v }}mm
              {% endfor %}
            icon: mdi:chart-bar
            icon_color: blue
            multiline_secondary: true
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    rgba(13,71,161,0.5) 0%,
                    rgba(21,101,192,0.25) 100%);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255,255,255,0.1);
                  border-radius: 22px;
                  font-family: monospace;
                }

          # Storico HA
          - type: history-graph
            title: Andamento pioggia storica totale
            hours_to_show: 168
            entities:
              - entity: sensor.sistema_irrigazione_meteo_pioggia_storica_totale
                name: Pioggia cumulata
              - entity: sensor.sistema_irrigazione_meteo_fattore_riduzione
                name: Fattore irrigazione %
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    rgba(13,71,161,0.4) 0%,
                    rgba(21,101,192,0.2) 100%);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255,255,255,0.1);
                  border-radius: 22px;
                }

          # ══════════════════════════════════════════════════
          # 7. IMPOSTAZIONI — Durate e soglie
          # ══════════════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "⚙️ Impostazioni"
            subtitle: Durate zone e soglie meteo

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: number.sistema_irrigazione_zona_1_durata_base
                name: "{{ states('text.sistema_irrigazione_zona_1_nome') }}"
                icon: mdi:timer-outline
                icon_color: teal
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0,96,100,0.45);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-entity-card
                entity: number.sistema_irrigazione_zona_2_durata_base
                name: "{{ states('text.sistema_irrigazione_zona_2_nome') }}"
                icon: mdi:timer-outline
                icon_color: teal
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0,96,100,0.45);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: number.sistema_irrigazione_zona_3_durata_base
                name: "{{ states('text.sistema_irrigazione_zona_3_nome') }}"
                icon: mdi:timer-outline
                icon_color: teal
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0,96,100,0.45);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-entity-card
                entity: number.sistema_irrigazione_zona_4_durata_base
                name: "{{ states('text.sistema_irrigazione_zona_4_nome') }}"
                icon: mdi:timer-outline
                icon_color: teal
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0,96,100,0.45);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }

          - type: custom:mushroom-entity-card
            entity: number.sistema_irrigazione_zone_attesa_tra_zone
            name: Attesa tra zone
            icon: mdi:timer-pause-outline
            icon_color: grey
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  background: rgba(30,30,50,0.5);
                  border: 1px solid rgba(255,255,255,0.08);
                  border-radius: 18px;
                }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('number.sistema_irrigazione_meteo_soglia_pioggia_storica') }} mm"
                secondary: Soglia storica
                icon: mdi:weather-pouring
                icon_color: >
                  {% set tot = states('sensor.sistema_irrigazione_meteo_pioggia_storica_totale') | float(0) %}
                  {% set soglia = states('number.sistema_irrigazione_meteo_soglia_pioggia_storica') | float(15) %}
                  {{ 'red' if tot >= soglia else 'blue' }}
                tap_action:
                  action: more-info
                  entity: number.sistema_irrigazione_meteo_soglia_pioggia_storica
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(74,20,140,0.4);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-template-card
                primary: "{{ states('number.sistema_irrigazione_meteo_soglia_pioggia_prevista') }} mm"
                secondary: Soglia previsione
                icon: mdi:weather-rainy
                icon_color: >
                  {% set mm = states('sensor.sistema_irrigazione_meteo_pioggia_prevista_domani') | float(0) %}
                  {% set soglia = states('number.sistema_irrigazione_meteo_soglia_pioggia_prevista') | float(3) %}
                  {{ 'red' if mm >= soglia else 'blue' }}
                tap_action:
                  action: more-info
                  entity: number.sistema_irrigazione_meteo_soglia_pioggia_prevista
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(74,20,140,0.4);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 18px;
                    }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.sistema_irrigazione_meteo_salta_se_pioggia_recente
                name: Skip storica
                icon: mdi:cancel
                icon_color: >
                  {{ 'red' if is_state('switch.sistema_irrigazione_meteo_salta_se_pioggia_recente','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(30,30,50,0.5);
                      border: 1px solid rgba(255,255,255,0.08);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-entity-card
                entity: switch.sistema_irrigazione_meteo_riduci_se_ha_piovuto
                name: Riduci
                icon: mdi:water-minus
                icon_color: >
                  {{ 'orange' if is_state('switch.sistema_irrigazione_meteo_riduci_se_ha_piovuto','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(30,30,50,0.5);
                      border: 1px solid rgba(255,255,255,0.08);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-entity-card
                entity: switch.sistema_irrigazione_meteo_salta_se_pioggia_prevista
                name: Skip prev.
                icon: mdi:weather-rainy
                icon_color: >
                  {{ 'red' if is_state('switch.sistema_irrigazione_meteo_salta_se_pioggia_prevista','on') else 'grey' }}
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(30,30,50,0.5);
                      border: 1px solid rgba(255,255,255,0.08);
                      border-radius: 18px;
                    }
