                      background: {{ 'rgba(230,81,0,0.48)' if states('switch.sistema_irrigazione_meteo_riduci_se_ha_piovuto') == 'on' else 'rgba(30,30,50,0.52)' }};
                      border: 2px solid {{ 'rgba(255,150,50,0.40)' if states('switch.sistema_irrigazione_meteo_riduci_se_ha_piovuto') == 'on' else 'rgba(255,255,255,0.07)' }};
                      border-radius: 18px;
