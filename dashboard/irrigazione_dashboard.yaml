                      border-radius: 18px;
                    }

          - type: custom:mushroom-entity-card
            entity: number.sistema_irrigazione_zone_attesa_tra_zone
            name: Attesa tra zone (secondi)
            icon: mdi:timer-pause-outline
            icon_color: grey
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  background: rgba(30,30,50,0.52);
                  border: 1px solid rgba(255,255,255,0.08);
                  border-radius: 18px;
                }

          # Soglie meteo
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: >
                  {{ states('number.sistema_irrigazione_meteo_soglia_pioggia_storica') }} mm
                secondary: Soglia storica skip
                icon: mdi:weather-pouring
                icon_color: >
                  {% set tot = states('sensor.sistema_irrigazione_meteo_pioggia_storica_totale') | float(0) %}
                  {% set soglia = states('number.sistema_irrigazione_meteo_soglia_pioggia_storica') | float(15) %}
                  {{ 'red' if tot >= soglia else 'indigo' }}
                tap_action:
                  action: more-info
                  entity: number.sistema_irrigazione_meteo_soglia_pioggia_storica
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(74,20,140,0.48);
                      border: 1px solid rgba(200,150,255,0.14);
                      border-radius: 18px;
                    }
              - type: custom:mushroom-template-card
                primary: >
                  {{ states('number.sistema_irrigazione_meteo_soglia_pioggia_prevista') }} mm
                secondary: Soglia previsione skip
                icon: mdi:weather-rainy
                icon_color: >
                  {% set mm = states('sensor.sistema_irrigazione_meteo_pioggia_prevista_domani') | float(0) %}
                  {% set soglia = states('number.sistema_irrigazione_meteo_soglia_pioggia_prevista') | float(3) %}
