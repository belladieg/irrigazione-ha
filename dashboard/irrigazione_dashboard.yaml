              - type: custom:mushroom-template-card
                primary: Sab
                icon: mdi:circle
                icon_color: >
                  {{ 'orange' if is_state('switch.sistema_irrigazione_giorni_sabato','on') else 'disabled' }}
                tap_action:
                  action: toggle
                  entity: switch.sistema_irrigazione_giorni_sabato
