                    ha-card {
                      background: {{ 'rgba(13,71,161,0.7)' if states('switch.sistema_irrigazione_giorni_mercoledi') == 'on' else 'rgba(50,50,50,0.4)' }};
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 16px;
