<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81d4fa"/>
      <stop offset="100%" style="stop-color:#29b6f6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
  </defs>

  <!-- Sfondo circolare -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Effetto glow centrale -->
  <circle cx="256" cy="270" r="160" fill="white" opacity="0.04"/>

  <!-- Testina irrigatore (corpo) -->
  <rect x="214" y="290" width="84" height="22" rx="11" fill="url(#water)"/>
  <rect x="234" y="265" width="44" height="32" rx="10" fill="#b3e5fc"/>
  <rect x="246" y="256" width="20" height="16" rx="6" fill="#e1f5fe"/>

  <!-- Stelo -->
  <rect x="244" y="310" width="24" height="88" rx="8" fill="url(#ground)"/>

  <!-- Base/terreno -->
  <ellipse cx="256" cy="398" rx="72" ry="14" fill="url(#ground)" opacity="0.8"/>
  <ellipse cx="256" cy="398" rx="56" ry="8" fill="#4caf50" opacity="0.5"/>

  <!-- Archi spray (5 getti) -->
  <!-- Spray sinistro estremo -->
  <path d="M 222 268 Q 170 230 148 168" stroke="white" stroke-width="7"
        stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Spray sinistro centro -->
  <path d="M 238 258 Q 210 215 196 155" stroke="white" stroke-width="7"
        stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Spray centrale -->
  <path d="M 256 252 Q 256 200 256 140" stroke="white" stroke-width="9"
        stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Spray destro centro -->
  <path d="M 274 258 Q 302 215 316 155" stroke="white" stroke-width="7"
        stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Spray destro estremo -->
  <path d="M 290 268 Q 342 230 364 168" stroke="white" stroke-width="7"
        stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Gocce spray (cerchi alle punte) -->
  <circle cx="144" cy="160" r="13" fill="#29b6f6" opacity="0.95"/>
  <circle cx="192" cy="146" r="13" fill="#29b6f6" opacity="0.95"/>
  <circle cx="256" cy="132" r="16" fill="#4fc3f7" opacity="0.95"/>
  <circle cx="320" cy="146" r="13" fill="#29b6f6" opacity="0.95"/>
  <circle cx="368" cy="160" r="13" fill="#29b6f6" opacity="0.95"/>

  <!-- Riflesso lucido in alto -->
  <ellipse cx="200" cy="140" rx="35" ry="14" fill="white" opacity="0.12" transform="rotate(-20 200 140)"/>
</svg>
